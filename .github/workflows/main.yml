name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Download APKTool
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.8.1/apktool_2.8.1.jar
        mkdir -p $HOME/bin
        mv apktool_2.8.1.jar $HOME/bin/apktool.jar
        echo '#!/bin/bash' > $HOME/bin/apktool
        echo 'java -jar $HOME/bin/apktool.jar "$@"' >> $HOME/bin/apktool
        chmod +x $HOME/bin/apktool
        echo "$HOME/bin" >> $GITHUB_PATH
    
    - name: Build APK with APKTool
      run: |
        apktool b --no-crunch --force-all --use-aapt2 . -o unsigned.apk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-apk
        path: unsigned.apk
        retention-days: 5

